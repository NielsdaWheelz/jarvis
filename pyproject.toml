[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "A small personal agent with durable conversation history"
readme = "README.md"
requires-python = ">=3.12.13,<3.13"
dependencies = [
  "alembic==1.16.5",
  "cryptography==50.0.1",
  "discord.py==2.7.1",
  "httpx==0.28.1",
  "llm-agent-kernel @ git+https://github.com/NielsdaWheelz/llm-agent-kernel.git@9d57e8945be5b26397c5a3942612f81a190f8db4",
  "llm-tools @ git+https://github.com/NielsdaWheelz/llm-tools.git@2adb9790fc7a54de5342effaca9391c2f3d24ff9",
  "pgvector==0.4.1",
  "psycopg[binary,pool]==3.2.9",
  "pydantic==2.12.5",
  "provider-runtime @ git+https://github.com/NielsdaWheelz/llm-calling.git@e1498d8382f192ae664ae9790b682a8e8a8b0d38",
  "sqlalchemy[asyncio]==2.0.43",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[dependency-groups]
dev = [
  "build==1.3.0",
  "pip-audit==2.9.0",
  "pyright==1.1.405",
  "ruff==0.12.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pyright]
include = ["src", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
