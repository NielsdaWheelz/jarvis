[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "A small personal agent with durable conversation history"
readme = "README.md"
requires-python = ">=3.12.13,<3.13"
dependencies = [
  "aiodns==4.0.4",
  "aiohttp==3.14.4",
  "alembic==1.16.5",
  "boto3==1.44.3",
  "cryptography==50.0.1",
  "discord.py @ git+https://github.com/NielsdaWheelz/discord.py.git@4c137a2de1c8aa36ac1df19f654afb99856824f2",
  "fastapi==0.143.0",
  "httpx==0.28.1",
  "llm-agent-kernel @ git+https://github.com/NielsdaWheelz/llm-agent-kernel.git@fcb6ecfb4088d85f64aafd8689e728058db27b0a",
  "llm-tools @ git+https://github.com/NielsdaWheelz/llm-tools.git@662a63a863bfefbc9c4f16025bd82f47262d99d6",
  "mcp==2.3.0",
  "pgvector==0.4.1",
  "psycopg[binary,pool]==3.2.9",
  "pydantic==2.12.5",
  "provider-runtime @ git+https://github.com/NielsdaWheelz/llm-calling.git@ea9f82025632926a7c7e47d6333fb9346f6ee86c",
  "sqlalchemy[asyncio]==2.0.43",
  "universal-memory @ git+https://github.com/NielsdaWheelz/universal-memory.git@b616ee924454f40305c49d3b73e81694819ba1e4",
  "uvicorn==0.54.0",
]

[project.scripts]
jarvis = "jarvis.cli:main"
jarvis-memory-collector = "jarvis.collector:main"

[dependency-groups]
dev = [
  "build==1.3.0",
  "pip-audit==2.9.0",
  "pyright==1.1.405",
  "ruff==0.12.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pyright]
include = ["src", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
