[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "A small personal agent with durable conversation history"
readme = "README.md"
requires-python = ">=3.12.13,<3.13"
dependencies = [
  "alembic==1.16.5",
  "boto3==1.44.3",
  "cryptography==50.0.1",
  "fastapi==0.143.0",
  "google-auth[requests]==2.57.1",
  "requests==2.34.2",
  "httpx==0.28.1",
  "llm-agent-kernel @ git+https://github.com/NielsdaWheelz/llm-agent-kernel.git@32e54aff6c6fb5ce627f0a15177072af7b4fdc47",
  "llm-tools @ git+https://github.com/NielsdaWheelz/llm-tools.git@37b7688381161d398b8094795d43bb7c87ca1885",
  "mcp==2.3.0",
  "pgvector==0.4.1",
  "psycopg[binary,pool]==3.2.9",
  "pydantic==2.12.5",
  "python-multipart==0.0.32",
  "provider-runtime @ git+https://github.com/NielsdaWheelz/llm-calling.git@fe6269cee5aea98533853342978358a05b008bcf",
  "sqlalchemy[asyncio]==2.0.43",
  "universal-memory @ git+https://github.com/NielsdaWheelz/universal-memory.git@6cfdf262e3c342ae4701b0587bf7994c03437459",
  "uvicorn==0.54.0",
]

[project.scripts]
jarvis = "jarvis.cli:main"
jarvis-memory-collector = "jarvis.collector:main"

[dependency-groups]
dev = [
  "build==1.3.0",
  "pip-audit==2.9.0",
  "pyright==1.1.405",
  "ruff==0.12.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pyright]
include = ["src", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
