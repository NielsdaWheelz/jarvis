[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "A small personal agent with durable conversation history"
readme = "README.md"
requires-python = ">=3.12.13,<3.13"
dependencies = [
  "alembic==1.16.5",
  "boto3==1.44.3",
  "cryptography==50.0.1",
  "discord.py==2.7.1",
  "fastapi==0.143.0",
  "httpx==0.28.1",
  "llm-agent-kernel @ git+https://github.com/NielsdaWheelz/llm-agent-kernel.git@9f5f951272536d51567995cbd693d1239ad59eb9",
  "llm-tools @ git+https://github.com/NielsdaWheelz/llm-tools.git@8989f3afdcc640f775bd0cc9e7a0b4c246f10e57",
  "mcp==2.3.0",
  "pgvector==0.4.1",
  "psycopg[binary,pool]==3.2.9",
  "pydantic==2.12.5",
  "provider-runtime @ git+https://github.com/NielsdaWheelz/llm-calling.git@ea9f82025632926a7c7e47d6333fb9346f6ee86c",
  "sqlalchemy[asyncio]==2.0.43",
  "universal-memory @ git+https://github.com/NielsdaWheelz/universal-memory.git@93e02af07fee7e79250fb800835c324f092b5bec",
  "uvicorn==0.54.0",
]

[project.scripts]
jarvis = "jarvis.cli:main"
jarvis-memory-collector = "jarvis.collector:main"

[dependency-groups]
dev = [
  "build==1.3.0",
  "pip-audit==2.9.0",
  "pyright==1.1.405",
  "ruff==0.12.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pyright]
include = ["src", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
