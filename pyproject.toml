[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "A small personal agent with durable conversation history"
readme = "README.md"
requires-python = ">=3.12.13,<3.13"
dependencies = [
  "alembic==1.16.5",
  "cryptography==50.0.1",
  "discord.py==2.7.1",
  "fastapi==0.143.0",
  "httpx==0.28.1",
  "llm-agent-kernel @ git+https://github.com/NielsdaWheelz/llm-agent-kernel.git@4ac3f4b8897d7463e2db3e2899fa95ba28a23f50",
  "llm-tools @ git+https://github.com/NielsdaWheelz/llm-tools.git@5a37102bc73c1af0c23e63c5b70df320661f63ed",
  "mcp==2.3.0",
  "pgvector==0.4.1",
  "psycopg[binary,pool]==3.2.9",
  "pydantic==2.12.5",
  "provider-runtime @ git+https://github.com/NielsdaWheelz/llm-calling.git@ac547ad2a0be0523b32c7f54a831038b0191d6cd",
  "sqlalchemy[asyncio]==2.0.43",
  "universal-memory @ git+https://github.com/NielsdaWheelz/universal-memory.git@5d52e6a266c9769dafa318a24c21236db8929903",
  "uvicorn==0.54.0",
]

[project.scripts]
jarvis = "jarvis.cli:main"
jarvis-memory-collector = "jarvis.collector:main"

[dependency-groups]
dev = [
  "build==1.3.0",
  "pip-audit==2.9.0",
  "pyright==1.1.405",
  "ruff==0.12.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pyright]
include = ["src", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
