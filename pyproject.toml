[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "A small personal agent with durable conversation history"
readme = "README.md"
requires-python = ">=3.12.13,<3.13"
dependencies = [
  "alembic==1.16.5",
  "cryptography==50.0.1",
  "discord.py==2.7.1",
  "fastapi==0.143.0",
  "httpx==0.28.1",
  "llm-agent-kernel @ git+https://github.com/NielsdaWheelz/llm-agent-kernel.git@e1bec2731ec35aa8c07f2eb277d8993332a7490c",
  "llm-tools @ git+https://github.com/NielsdaWheelz/llm-tools.git@73056dfb23733e68bd32b6765cc34880f69674bd",
  "mcp==2.3.0",
  "pgvector==0.4.1",
  "psycopg[binary,pool]==3.2.9",
  "pydantic==2.12.5",
  "provider-runtime @ git+https://github.com/NielsdaWheelz/llm-calling.git@d9550d9c53af3d7b608250d9a0db131d78dccf64",
  "sqlalchemy[asyncio]==2.0.43",
  "universal-memory @ git+https://github.com/NielsdaWheelz/universal-memory.git@d824d33df9c136952f1d01f7c4a4ad389df42ef1",
  "uvicorn==0.54.0",
]

[project.scripts]
jarvis = "jarvis.cli:main"
jarvis-memory-collector = "jarvis.collector:main"

[dependency-groups]
dev = [
  "build==1.3.0",
  "pip-audit==2.9.0",
  "pyright==1.1.405",
  "ruff==0.12.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pyright]
include = ["src", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
