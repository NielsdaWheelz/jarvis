[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "A small personal agent with durable conversation history"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "alembic==1.16.5",
  "cryptography==50.0.1",
  "discord.py==2.7.1",
  "httpx==0.28.1",
  "llm-agent-kernel @ git+https://github.com/NielsdaWheelz/llm-agent-kernel.git@21084bec674023ea572950a18dde464506ea37ad",
  "llm-tools @ git+https://github.com/NielsdaWheelz/llm-tools.git@9e6d155f3b64f03495911435b7cae8b8d131f9a2",
  "openai-codex-cli-bin==0.144.4",
  "openai-codex==0.144.4",
  "pgvector==0.4.1",
  "psycopg[binary,pool]==3.2.9",
  "pydantic==2.12.5",
  "provider-runtime[codex-sdk] @ git+https://github.com/NielsdaWheelz/llm-calling.git@4ddced3bb5487ce988858c4c6d45d2e5ee0acad9",
  "sqlalchemy[asyncio]==2.0.43",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[dependency-groups]
dev = [
  "build==1.3.0",
  "pip-audit==2.9.0",
  "pyright==1.1.405",
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "ruff==0.12.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
markers = ["postgres: requires a disposable PostgreSQL database"]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
