<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>jarvis</title>
    <link rel="stylesheet" href="/static/home/home.css" />
    <link id="chat-icon" rel="icon" href="/static/home/chat-rest.svg" />
    <link rel="preload" href="/static/home/fonts/literata-3.103-roman-1ab05c52.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/static/home/fonts/literata-3.103-italic-01e71417.woff2" as="font" type="font/woff2" crossorigin />
    <script type="module" src="/static/home/home.js"></script>
  </head>
  <body>
    <main id="workspace">
      <header class="bar">
        <span class="presence-signature">
          <a class="wordmark" href="/" aria-label="jarvis home" aria-describedby="presence-description"><span>jarvis</span></a>
          <span id="presence-slot">
            <button id="presence-mark" type="button" class="presence-mark presence-point" data-point="none">
              <span aria-hidden="true">¶</span>
            </button>
          </span>
        </span>
        <span id="presence-description" class="sr-only"></span>
        <span id="presence-legend" class="presence-legend" hidden></span>
        <nav class="destinations" aria-label="workspace">
          <a id="todos-tab" href="/todos">todos</a>
          <a id="artifacts-tab" href="/artifacts">artifacts</a>
          <a id="files-tab" href="/files">files</a>
        </nav>
        <a id="artifact-return" href="/artifacts" hidden>back to artifacts</a>
        <button id="files-return" type="button" hidden>back</button>
        <button id="todo-return" type="button" hidden>back</button>
        <span id="location"></span>
        <button id="sidebar-open" type="button" aria-controls="sidebar">chat<span class="chat-count" aria-hidden="true" hidden></span></button>
      </header>
      <p id="artifact-status" role="status" hidden></p>
      <section id="canvas" aria-label="workspace">
        <div id="object"></div>
        <section id="artifacts" aria-label="published artifacts" hidden></section>
        <section id="drive" aria-label="files" hidden></section>
        <section id="todos" aria-label="todos" hidden>
          <h1 tabindex="-1">todos</h1>
          <div id="todo-list"></div>
          <p id="todo-empty" hidden>no active todos.</p>
          <small id="checked"></small>
          <div id="todo-error" role="status" hidden></div>
        </section>
      </section>
      <footer id="object-tools" hidden></footer>
    </main>
    <aside id="sidebar" aria-label="conversation">
      <header id="chat-bar" hidden>
        <button id="sidebar-close" type="button">back</button>
      </header>
      <p id="message-unavailable" class="secondary" role="status" hidden>this message is no longer available.</p>
      <section id="chat" class="panel" aria-label="chat">
        <button id="older" hidden>earlier messages</button>
        <div id="chat-page">
          <div id="messages"></div>
          <article id="presence-tail" hidden>
            <div class="stamp"><strong class="sr-only">jarvis</strong><time></time></div>
            <div class="presence-caption">
              <span class="presence-point" aria-hidden="true"></span>
              <span class="presence-words"></span>
            </div>
          </article>
        </div>
      </section>
      <div id="chat-ledge" hidden>
        <button type="button" hidden><span class="chat-lozenge" aria-hidden="true"></span><span></span></button>
        <button type="button" class="owed" hidden></button>
        <button type="button" hidden></button>
      </div>
      <div id="chat-live" class="sr-only" role="status" aria-atomic="true"></div>
      <section id="workspace-approval" aria-label="google approval" hidden></section>
      <form id="composer">
        <div id="context" hidden>
          <span id="ref-label"></span>
          <button id="remove-ref" type="button" aria-label="remove reference">×</button>
        </div>
        <div id="draft-choice" hidden></div>
        <div id="file-list"></div>
        <label class="sr-only" for="message">message jarvis</label>
        <div id="writing">
          <textarea id="message" rows="1" placeholder="to jarvis"></textarea>
        </div>
        <div id="file-problem" role="status"></div>
        <div id="compose-actions">
          <label class="attach" id="attach">attach<input id="files" type="file" multiple aria-label="attach" /></label>
          <span id="receipt" role="status"></span>
          <button id="send" type="submit">send</button>
          <button id="stop-waiting" type="button" hidden>stop waiting</button>
          <button id="retry-send" type="submit" hidden>retry</button>
          <button id="discard" type="button" hidden>discard</button>
        </div>
        <div id="discard-choice" hidden>
          <span>discard these words? a send that did arrive stays in the conversation.</span>
          <button id="keep" type="button">keep</button>
          <button id="confirm-discard" type="button">discard</button>
        </div>
      </form>
    </aside>
    <div id="presence-announcement" class="sr-only" role="status"></div>
    <div id="connection" role="status" hidden></div>
  </body>
</html>
