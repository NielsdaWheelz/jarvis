services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: jarvis_migrator
      POSTGRES_PASSWORD: jarvis-migrator-dev
      TZ: UTC
    ports:
      - "127.0.0.1:54328:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis_migrator -d jarvis"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - jarvis-postgres:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/001-jarvis-runtime.sql:ro

volumes:
  jarvis-postgres:
