<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>jarvis</title>
    <link rel="stylesheet" href="/static/home/home.css" />
    <script type="module" src="/static/home/home.js"></script>
  </head>
  <body>
    <main id="workspace">
      <header class="bar">
        <a class="wordmark" href="/" aria-label="jarvis home">jarvis</a>
        <button id="todos-tab" type="button" aria-pressed="false">todos</button>
        <button id="files-tab" type="button" aria-pressed="false">files</button>
        <button id="files-return" type="button" hidden>back</button>
        <button id="todo-return" type="button" hidden>back</button>
        <span id="location"></span>
        <button id="sidebar-open" aria-label="open conversation" aria-controls="sidebar">
          conversation
        </button>
      </header>
      <section id="canvas" aria-label="workspace">
        <div id="object"></div>
        <section id="drive" aria-label="files" hidden></section>
        <section id="overview" aria-label="todos" hidden>
          <h1 tabindex="-1">todos</h1>
          <div id="todo-list"></div>
          <p id="todo-empty" hidden>no active todos.</p>
          <small id="checked"></small>
          <div id="todo-error" role="status" hidden></div>
        </section>
      </section>
      <footer id="object-tools" hidden></footer>
    </main>
    <aside id="sidebar" aria-label="conversation">
      <header class="bar">
        <span class="sidebar-title">chat</span>
        <button id="sidebar-close" aria-label="close sidebar">close</button>
      </header>
      <nav aria-label="workspace sections">
        <details id="phone-alerts">
          <summary>phone alerts</summary>
          <p id="phone-status" role="status"></p>
          <button id="disconnect-phone" type="button" hidden>disconnect phone alerts</button>
        </details>
      </nav>
      <section id="chat" class="panel" aria-label="chat">
        <button id="older" hidden>earlier messages</button>
        <div id="messages"></div>
      </section>
      <section id="workspace-approval" aria-label="google approval" hidden></section>
      <form id="composer">
        <div id="context" hidden>
          <span id="ref-label"></span>
          <button id="remove-ref" type="button">remove reference</button>
        </div>
        <div id="draft-choice" hidden></div>
        <label class="sr-only" for="message">message jarvis</label>
        <textarea id="message" rows="2" placeholder="message jarvis…"></textarea>
        <div id="file-list"></div>
        <div id="file-problem" role="status"></div>
        <div id="uncertain-help" hidden>
          the earlier message may still arrive.
          <a href="/" target="_blank" rel="noopener">open an empty draft</a>
        </div>
        <div class="compose-actions">
          <label class="attach">attach<input id="files" type="file" multiple /></label>
          <button id="send" type="submit">send</button>
        </div>
        <div id="receipt" role="status"></div>
      </form>
    </aside>
    <div id="connection" role="status" hidden></div>
  </body>
</html>
